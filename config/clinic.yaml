# Dados do consultório. Itens marcados com [A DEFINIR] precisam ser preenchidos
# antes de ir para produção. Nada aqui é segredo; segredos ficam no .env.

medica: "Dra. Ana Paula"
especialidade: "nefrologista"
cidade: "São Carlos (SP)"

site: "https://anapaulagiraldes.com.br"
endereco: "[A DEFINIR]"
formas_pagamento: "PIX ou dinheiro"
politica_cancelamento: "Cancelamentos e remarcações devem ser feitos com pelo menos 10 dias de antecedência."
# Dentro deste prazo o bot não cancela/remarca sozinho: transfere para a equipe decidir.
cancelamento_prazo_dias: 10

valores:
  consulta: "R$ 500,00"

retorno:
  prazo_dias: 45
  duracao_minutos: 45

atendimento:
  duracao_minutos: 60
  antecedencia_minima_horas: 24
  janela_maxima_dias: 60
  # Janelas de atendimento por dia da semana. Lista vazia = não atende.
  dias:
    seg: []
    ter: ["08:00-16:00"]
    qua: []
    qui: []
    sex: []
    sab: []
    dom: []

lembretes:
  horario_execucao: "09:00"   # America/Sao_Paulo
  dias_antes: 3
  dias_depois: 3

privacidade:
  retencao_mensagens_dias: 365   # [A DEFINIR] sugestão: 12 meses
  aviso_primeiro_contato: >-
    Olá! Sou a assistente virtual da Dra. Ana Paula. Para o agendamento, utilizamos
    apenas seu nome e telefone, conforme a LGPD.

# Respostas fixas do router. Mensagens clínicas NUNCA recebem resposta gerada pela IA:
# o bot envia este texto, transfere a conversa para a equipe e para de responder.
mensagens:
  clinico: >-
    Obrigada pela mensagem. Como se trata de uma questão de saúde, ela foi encaminhada
    para a equipe da Dra. Ana Paula, que vai responder assim que possível.
  urgente: >-
    Recebemos sua mensagem e ela foi encaminhada com prioridade para a equipe da
    Dra. Ana Paula, que vai responder o mais rápido possível.

templates:
  lembrete_consulta: "lembrete_consulta"
  pos_consulta: "pos_consulta"
  alerta_urgente: "alerta_urgente"   # opcional, aviso para o celular da Dra.
  idioma: "pt_BR"
